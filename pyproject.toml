[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rigconductor"
version = "0.1.0"
description = "One GUI from Motif recording to analysed results on a USB disk (Drosophila arenas, Xenopus 24-well plates)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Bart R.H. Geurten", email = "bart.geurten@otago.ac.nz"}]
keywords = ["motif", "loopbio", "behaviour", "drosophila", "xenopus", "slurm"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
drosophila = ["thermokourt"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]
all = ["rigconductor[gui,drosophila,dev]"]

[project.scripts]
rigconductor = "rigconductor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rigconductor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
